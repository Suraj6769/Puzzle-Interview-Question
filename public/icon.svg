<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Stylized Brain & Tech Puzzle Symbol -->
  <g transform="translate(96, 96) scale(0.625)" filter="url(#shadow)">
    <path
      d="M256 64 C200 64 160 100 160 150 C160 165 164 179 171 192 C142 205 120 234 120 270 C120 300 134 326 156 342 C152 353 150 364 150 376 C150 424 190 464 240 464 C255 464 269 460 282 453 C295 460 309 464 324 464 C374 464 414 424 414 376 C414 364 412 353 408 342 C430 326 444 300 444 270 C444 234 422 205 393 192 C400 179 404 165 404 150 C404 100 364 64 308 64 C290 64 273 69 256 78 C239 69 222 64 256 64 Z"
      fill="url(#glow)"
    />
    <!-- Futuristic Neural Nodes / Puzzle Knots -->
    <circle cx="210" cy="180" r="14" fill="#ffffff" />
    <circle cx="310" cy="180" r="14" fill="#ffffff" />
    <circle cx="180" cy="270" r="14" fill="#ffffff" />
    <circle cx="340" cy="270" r="14" fill="#ffffff" />
    <circle cx="260" cy="330" r="16" fill="#ffffff" />
    <path d="M210 180 L260 330 L310 180" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <path d="M180 270 L260 330 L340 270" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  </g>

  <!-- Level Master Stars -->
  <g fill="#f59e0b" transform="translate(196, 400) scale(0.8)">
    <polygon points="25,2 32,18 49,18 35,29 40,46 25,36 10,46 15,29 1,18 18,18" />
    <polygon points="75,2 82,18 99,18 85,29 90,46 75,36 60,46 65,29 51,18 68,18" />
    <polygon points="125,2 132,18 149,18 135,29 140,46 125,36 110,46 115,29 101,18 118,18" />
  </g>
</svg>
